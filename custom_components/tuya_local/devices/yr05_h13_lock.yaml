name: Door lock
products:
  - id: hhxgpozj
    name: Smart Lock
    model: YR05 H13 new-chip
entities:
  - entity: lock
    dps:
      - id: 46
        type: boolean
        name: lock
      - id: 47
        type: boolean
        name: lock_state
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
      - id: 71
        type: string
        name: authenticated_ble_unlock
        optional: true
        persist: false
        sensitive: true
  - entity: sensor
    class: battery
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        range:
          min: 0
          max: 100
